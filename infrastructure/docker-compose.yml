version: '3'
networks:
  openhim:

services:
  # NOTE: upgrading an existing deployment's mongo-data volume from an
  # older major version requires a sequential upgrade (e.g. 4.0->4.2->4.4->5.0->6.0)
  # with featureCompatibilityVersion set at each step - see
  # https://www.mongodb.com/docs/manual/release-notes/6.0-upgrade-standalone/
  # Swapping this tag in place against pre-existing 4.0 data will not work.
  mongo-db:
    container_name: mongo-db
    image: mongo:6
    networks:
      - openhim
    volumes:
      - "mongo-data:/data/db"
    restart: unless-stopped

  openhim-core:
    container_name: openhim-core
    image: jembi/openhim-core:latest
    restart: unless-stopped
    environment:
      - mongo_url=mongodb://mongo-db/openhim-development
      - mongo_atnaUrl=mongodb://mongo-db/openhim-development
      - NODE_ENV=development
      - api_authenticationTypes=["token", "basic", "openid", "local"]
      - authentication_enableCustomTokenAuthentication=true
      - authentication_enableJWTAuthentication=true
      - authentication_jwt_secretOrPublicKey=secret
      - authentication_jwt_algorithms=HS256
      - authentication_jwt_issuer=openhim
      - openhimConsoleBaseUrl=http://localhost:9000
    ports:
      - "8080:8080"
      - "5000:5000"
      - "5001:5001"
    networks:
      - openhim
    healthcheck:
      test: "curl -sSk https://openhim-core:8080/heartbeat || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

  openhim-console:
    container_name: openhim-console
    image: jembi/openhim-console:latest
    restart: unless-stopped
    networks:
      - openhim
    ports:
      - "9000:80"
    healthcheck:
      test: "curl -sS http://openhim-console || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3

volumes:
  mongo-data:
