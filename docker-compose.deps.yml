version: "3"

services:
  zookeeper:
    image: docker.io/bitnami/zookeeper:3.8
    ports:
      - "2181:2181"
    volumes:
      - "zookeeper_data:/bitnami"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: docker.io/bitnami/kafka:3.4
    ports:
      - "9092:9092"
    volumes:
      - "kafka_data:/bitnami"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
    depends_on:
      - zookeeper

  # NOTE: upgrading an existing deployment's mongo-data volume from an
  # older major version requires a sequential upgrade (e.g. 4.0->4.2->4.4->5.0->6.0)
  # with featureCompatibilityVersion set at each step - see
  # https://www.mongodb.com/docs/manual/release-notes/6.0-upgrade-standalone/
  # Swapping this tag in place against pre-existing 4.0 data will not work.
  mongo-db:
    container_name: mongo-db
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - "mongo-data:/data/db"
    restart: unless-stopped

volumes:
  mongo-data:
  zookeeper_data:
  kafka_data:
